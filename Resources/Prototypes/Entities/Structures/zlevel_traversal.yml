- type: entity
  id: ZLevelStairsUp
  parent: Stairs
  name: z-level stairs up
  description: A staircase that leads to the floor above.
  components:
  - type: Sprite
    sprite: Structures/stairs.rsi
    state: stairs_steel
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.15
    ignoreWeightless: true
    stepOn: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - WallLayer
        mask:
        - ItemMask
        density: 1000
        hard: false
  - type: ZLevelTraversal
    zOffset: 1
  - type: ZLevelBoundary
    boundaryOffset: 1
    opens:
    - TraversalUp
    - TraversalDown
    - Atmosphere
    - Visibility
    - Sound
    - Projectile
    - Explosion
    - Interaction

